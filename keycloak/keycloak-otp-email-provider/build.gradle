plugins {
	id 'java'
}

group = 'com.servemenu.keycloak'
version = '0.0.1-SNAPSHOT'
description = 'Keycloak spi project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	compileOnly("org.keycloak:keycloak-server-spi:26.4.0")
	compileOnly("org.keycloak:keycloak-services:26.4.0")
	compileOnly("org.keycloak:keycloak-core:26.4.0")
	compileOnly("org.keycloak:keycloak-server-spi-private:26.4.0")
}

tasks.jar {
	archiveFileName = 'keycloak-otp-email-provider.jar'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	manifest {
		attributes 'Implementation-Title': project.name,
				'Implementation-Version': project.version
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
