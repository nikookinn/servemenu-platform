plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.4'
	id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'com.servemenu'
version = '0.0.1-SNAPSHOT'
description = 'Media Service for Servemenu Platform'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven {
		url 'https://packages.confluent.io/maven/'
	}
}

ext {
	set('springCloudVersion', "2025.0.0")
	set('grpcVersion', '1.68.2')
	set('protobufVersion', '4.29.2')
	set('grpcSpringBootStarterVersion', '3.1.0.RELEASE')
}

dependencies {
	// Shared Events Module (Avro schemas) - local JAR
	implementation files('../shared-events/build/libs/shared-events-1.0.0.jar')
	
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	
	// Spring Cloud
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	
	// gRPC Server
	implementation "net.devh:grpc-server-spring-boot-starter:${grpcSpringBootStarterVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	implementation 'javax.annotation:javax.annotation-api:1.3.2'
	
	// Database
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	
	// AWS SDK v2
	implementation 'software.amazon.awssdk:s3:2.28.25'
	implementation 'software.amazon.awssdk:netty-nio-client:2.28.25'
	
	// Image Processing
	implementation 'net.coobird:thumbnailator:0.4.20'
	implementation 'com.twelvemonkeys.imageio:imageio-core:3.12.0'
	implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'  // WebP support
	
	// Kafka
	implementation 'org.springframework.kafka:spring-kafka'
	
	// Avro & Schema Registry
	implementation 'io.confluent:kafka-avro-serializer:7.9.1'
	implementation 'org.apache.avro:avro:1.12.0'
	
	// Resilience4j (Rate Limiting, Circuit Breaker, Retry, Bulkhead)
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'
	
	// File Content Scanning (ClamAV client)
	implementation 'xyz.capybara:clamav-client:2.1.2'
	
	// Observability & Monitoring
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	
	// Utilities
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Protobuf configuration
protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}

// Avro configuration - REMOVED (now using shared-events module)
// avro {
// 	createSetters = true
// 	fieldVisibility = "PRIVATE"
// 	outputCharacterEncoding = "UTF-8"
// 	stringType = "String"
// 	enableDecimalLogicalType = true
// }

// Ensure generated sources are included
sourceSets {
	main {
		java {
			srcDirs 'build/generated/source/proto/main/grpc'
			srcDirs 'build/generated/source/proto/main/java'
			// srcDirs 'build/generated-main-avro-java' // REMOVED - using shared-events
		}
	}
}
