server:
  port: 8086  # Changed from 8085 (Debezium Connect uses 8085)
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: media-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB

  # Database configuration will be provided by profile-specific configs
  # dev: localhost:5432 with hardcoded credentials
  # prod: postgres:5432 with environment variables

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
    consumer:
      group-id: media-service-qr-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 3
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
    listener:
      ack-mode: manual
      concurrency: 3
      poll-timeout: 3000
      observation-enabled: true

# Kafka Topics - 2025 Standard Pattern: events.{aggregate_type}.{event_type}
kafka:
  topics:
    # Consumer topics (from Business Service)
    qr-generated: events.qr.QRGenerated
    table-created: events.business.TableCreated
    table-deleted: events.business.TableDeleted
    store-deleted: events.business.StoreDeleted
    wifi-settings-deleted: events.business.WifiSettingsDeleted
    
    # Producer topics (published by media-service)
    media-uploaded: events.media.MediaUploaded
    media-deleted: events.media.MediaDeleted

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    metadata-map:
      zone: ${ZONE:zone1}
      version: ${VERSION:1.0.0}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.servemenu: INFO
    org.springframework.web: INFO
    org.springframework.kafka: WARN
    org.springframework.kafka.listener: WARN  # Suppress "Received: 0 records" logs
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Media Configuration - Common for all profiles
media:
  allowed-extensions:
    - jpg
    - jpeg
    - png
    - webp
  max-file-size: 10485760  # 10MB in bytes
  image:
    max-width: 2048
    max-height: 2048
    quality: 0.85

  # Validation
  validation:
    strict-mode: true
    check-image-integrity: true

# AWS S3 Base Configuration (will be overridden by profile-specific configs)
aws:
  s3:
    region: ${AWS_REGION:eu-central-1}
    bucket-name: servemenu-media
    upload-timeout: 60
    connection-timeout: 10
    max-connections: 50