spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_service_db}
    username: ${USER_SERVICE_USER:user_service_user}
    password: ${USER_SERVICE_PASSWORD:user_pass}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    com.servemenu.userservice: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.security: DEBUG