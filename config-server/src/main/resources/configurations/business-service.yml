spring:
  application:
    name: business-service
  
  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  # Virtual Threads ile optimize edilmiş HikariCP pool
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${BUSINESS_SERVICE_DB:business_service_db}
    username: ${BUSINESS_SERVICE_USER:business_service_user}
    password: ${BUSINESS_SERVICE_PASSWORD:business_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Virtual Threads için artırıldı (önceki: 20)
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: BusinessServiceHikariPool
      # Virtual Threads optimizasyonları
      leak-detection-threshold: 60000
      register-mbeans: true

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        generate_statistics: false
        enable_lazy_load_no_trans: false
    open-in-view: false
    show-sql: false

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour
      cache-null-values: false

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        compression.type: snappy
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
    consumer:
      group-id: business-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
        specific.avro.reader: true
        max.poll.records: 10
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    listener:
      ack-mode: manual
      concurrency: 3
      poll-timeout: 3000
      observation-enabled: true  # Enable Kafka consumer tracing
    template:
      observation-enabled: true  # Enable Kafka producer tracing

  # OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/servemenu-platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/servemenu-platform/protocol/openid-connect/certs}

# Kafka Topics - 2025 Standard Pattern: events.{aggregate_type}.{event_type}
kafka:
  topics:
    # Consumer topics
    business-owner-created: events.user.BusinessOwnerCreated
    media-uploaded: events.media.MediaUploaded
    
    # Producer topics (published by business-service)
    business-created: events.business.BusinessCreated
    business-details-completed: events.business.BusinessDetailsCompleted
    business-updated: events.business.BusinessUpdated
    business-deleted: events.business.BusinessDeleted
    store-created: events.store.StoreCreated
    store-updated: events.store.StoreUpdated
    store-deleted: events.store.StoreDeleted
    table-created: events.table.TableCreated
    table-updated: events.table.TableUpdated
    table-deleted: events.table.TableDeleted
    menu-assigned: events.menu.MenuAssigned

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9094}  # Changed to 9094 to avoid conflicts (9090=pgAdmin, 9091=Prometheus, 9092=Kafka)
    enable-reflection: true
    max-inbound-message-size: 10MB
    max-inbound-metadata-size: 8KB

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    metadata-map:
      version: ${spring.application.version:0.0.1}
      environment: ${spring.profiles.active}
      grpc.port: ${GRPC_SERVER_PORT:9094}

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

# Logging
logging:
  level:
    root: INFO
    com.servemenu.businessservice: DEBUG
    org.springframework.kafka: WARN
    org.springframework.kafka.listener: WARN  # Suppress "Received: 0 records" logs
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: ERROR
    net.devh.boot.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

