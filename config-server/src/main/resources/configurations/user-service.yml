spring:
  application:
    name: user-service
  
  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  # Virtual Threads ile optimize edilmiş HikariCP pool
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_service_db}
    username: ${USER_SERVICE_USER:user_service_user}
    password: ${USER_SERVICE_PASSWORD:user_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Virtual Threads için artırıldı (önceki: 20)
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: UserServiceHikariPool
      # Virtual Threads optimizasyonları
      leak-detection-threshold: 60000
      register-mbeans: true

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false
    show-sql: false

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        compression.type: snappy
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:9081}
    listener:
      ack-mode: manual
      concurrency: 3
      poll-timeout: 3000
      observation-enabled: true  # Enable Kafka consumer tracing
    template:
      observation-enabled: true  # Enable Kafka producer tracing

  # Security - OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/servemenu-platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/servemenu-platform/protocol/openid-connect/certs}

# Keycloak Admin Client - CLIENT_CREDENTIALS
keycloak:
  realm: ${KEYCLOAK_REALM:servemenu-platform}
  auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:F48hFF7xRowfBVstYgHQdLjx6x4K9IaZ}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:servemenu-platform}

# Kafka Topics - 2025 Standard Pattern: events.{aggregate_type}.{event_type}
kafka:
  topics:
    # Consumer topics (from Keycloak SPI)
    user-registered: events.keycloak.UserRegistered
    email-verified: events.keycloak.EmailVerified
    
    # Consumer topics (from business-service)
    business-created: events.business.BusinessCreated
    business-details-completed: events.business.BusinessDetailsCompleted
    business-updated: events.business.BusinessUpdated
    store-created: events.business.StoreCreated
    store-updated: events.business.StoreUpdated
    store-deleted: events.business.StoreDeleted

    # Producer topics (published by user-service)
    business-owner-created: events.user.BusinessOwnerCreated
    onboarding-completed: events.user.OnboardingCompleted
    store-user-created: events.user.StoreUserCreated
    customer-created: events.user.CustomerCreated

# gRPC Server & Client Configuration
grpc:
  server:
    enabled: false
    port: 9095  # Changed from default 9090 to avoid conflict with pgAdmin
  client:
    business-service:
      # Development: Single instance (IntelliJ)
      # Production: Eureka-based service discovery with load balancing
      address: ${GRPC_BUSINESS_SERVICE_ADDRESS:static://localhost:9094}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      max-inbound-message-size: 10MB
      # Load balancing strategy (only for discovery://)
      default-load-balancing-policy: round_robin
      # Health check
      health-check-enabled: true

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    metadata-map:
      version: ${spring.application.version:0.0.1}
      environment: ${spring.profiles.active}

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

# Logging
logging:
  level:
    root: INFO
    com.servemenu.userservice: DEBUG
    org.springframework.kafka: WARN
    org.springframework.kafka.listener: WARN  # Suppress "Received: 0 records" logs
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server
server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Application Specific
application:
  outbox:
    relay:
      enabled: true
      fixed-delay: 5000
      batch-size: 100